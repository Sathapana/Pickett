[package]
name = "pickett-py"
version = "0.1.0"
edition.workspace = true
description = "Python bindings (PyO3) for the Pickett SPFIT/SPCAT library"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
# a Python extension: tested from Python (tests/test_pickett.py), not by cargo test
test = false
doctest = false

[dependencies]
pickett = { path = "../pickett" }
pickett-io = { path = "../pickett-io" }
pickett-sys = { path = "../pickett-sys" }
pickett-spectrum = { path = "../pickett-spectrum" }
numpy = "0.30.0"
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py39", "generate-import-lib"] }
