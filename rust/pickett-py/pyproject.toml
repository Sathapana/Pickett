[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "pickett"
version = "0.1.0"
description = "Predict and fit rotational spectra with Pickett's SPCAT/SPFIT, and analyse measured spectra"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[tool.maturin]
python-source = "python"
module-name = "pickett._native"
